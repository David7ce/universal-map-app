<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Map</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZmlsbD0iIzI2NmE4YiIgZD0iTTEyIDJhNyA3IDAgMCAwLTcgN2MwIDUuMjUgNyAxMyA3IDEzczctNy43NSA3LTEzYTcgNyAwIDAgMC03LTdabTAgOS41QTIuNSAyLjUgMCAxIDEgMTIgNmEyLjUgMi41IDAgMCAxIDAgNS41WiIvPjwvc3ZnPg=="
    />
  </head>
  <body>
    <div id="app" class="map-app">
      <div id="loading-overlay" class="loading-overlay" role="status" aria-label="Loading">
        <div class="loading-overlay__spinner"></div>
      </div>

      <div id="welcome-view" class="welcome-view"></div>

      <div id="map" class="map"></div>

      <div id="view-switcher" class="view-switcher"></div>

      <div id="calendar-view" class="calendar-view"></div>

      <div id="search-overlay"></div>

      <button
        type="button"
        id="panel-right-toggle"
        class="panel-toggle-btn"
        aria-controls="panel-right"
        aria-expanded="false"
      ></button>
      <div id="panel-overlay" class="panel-overlay"></div>

      <aside id="panel-right" class="panel panel--right" aria-hidden="true">
        <header class="panel__header">
          <div class="panel__title" data-role="filters-title"></div>
          <button type="button" id="panel-right-close" class="panel__close-btn" aria-label="Close filters"></button>
        </header>
        <div class="panel__content">
          <div id="panel-right-filters"></div>
          <div class="panel__section-separator"></div>
          <div id="panel-right-time" class="calendar-bar"></div>
          <div class="panel__section-separator"></div>
          <div id="panel-right-map-settings" class="settings-control"></div>
          <div class="panel__section-separator"></div>
          <div id="panel-right-actions"></div>
        </div>
      </aside>

      <div class="bottom-left-controls">
        <div id="layer-control" class="layer-control-map"></div>
      </div>

      <div id="lightbox"></div>

      <div class="map-footer-legend">
        <span class="map-date-text" id="map-date-text"></span>
        <div id="map-scale" class="map-scale">
          <span class="map-scale__line" data-role="scale-line"></span>
          <span class="map-scale__text" data-role="scale-text"></span>
        </div>
        <span class="data-attribution" id="map-attribution"></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
